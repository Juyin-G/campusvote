<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusVote — Demo Auth</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>CampusVote</h1>
        <p class="subtitle">Demo de login y logout</p>
      </header>

      <section id="status-panel" class="card status-card" aria-live="polite">
        <p id="session-status" class="status status--guest">Sin sesión activa</p>
        <dl id="user-info" class="user-info hidden"></dl>
      </section>

      <section id="login-panel" class="card">
        <h2>Iniciar sesión</h2>
        <form id="login-form" novalidate>
          <label for="email">Correo</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="usuario@universidad.edu"
            required
          />

          <label for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Tu contraseña"
            required
          />

          <button type="submit" class="btn btn--primary">Entrar</button>
        </form>
      </section>

      <section id="logout-panel" class="card hidden">
        <h2>Sesión activa</h2>
        <p>Ya iniciaste sesión. Puedes cerrarla cuando quieras.</p>
        <button id="logout-btn" type="button" class="btn btn--secondary">
          Cerrar sesión
        </button>
      </section>

      <section id="message-panel" class="message hidden" role="alert"></section>

      <footer class="footer">
        <p>API: <code id="api-base"></code></p>
        <p><a href="/api-docs">Documentación Swagger</a></p>
      </footer>
    </main>

    <script src="/js/auth.js" type="module"></script>
  </body>
</html>
